# One LoRA configuration shared by the SFT and GRPO arms (plan 5.3).
model: Qwen/Qwen2.5-Coder-1.5B-Instruct
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  bias: none
  task_type: CAUSAL_LM
seed: 0
# Training questions whose prompt exceeds this many tokens are dropped from BOTH
# arms (the count is recorded in run_metadata.json). Backpropagating through a
# batch of the longest schemas needs more than the 48 GB available.
max_prompt_tokens: 1536
