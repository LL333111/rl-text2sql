[project]
name = "rl-text2sql"
version = "0.1.0"
description = "GRPO vs. SFT post-training of a 1.5B code model for text-to-SQL"
requires-python = ">=3.10"
# Base deps: enough for the execution harness, splits, tests and analysis.
# These run anywhere (including Windows).
dependencies = [
    "numpy==2.5.5",
    "scipy==1.18.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "gdown==6.5.1"]
# GPU deps run on the Linux training machine only (vLLM has no native Windows
# build). Exact versions are frozen into requirements-gpu.lock from the first
# working install on that machine; see scripts/setup_gpu.sh.
gpu = [
    "torch",
    "transformers",
    "peft",
    "trl",
    "datasets",
    "accelerate",
    "vllm",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
